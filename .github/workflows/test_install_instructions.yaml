name: Test install instructions
run-name: >-
  ${{ inputs.repo }} - Validate
  ${{
    case(
      inputs.branch != '', format('branch {0}', inputs.branch),
      inputs.version != '', format('release {0}', inputs.version),
      inputs.pull-request != 0, format('PR {0}', inputs.pull-request),
      'latest stable release'
    )
  }}

on:
  workflow_dispatch:
    inputs:
      repo:
        type: string
        default: Cog-Creators/Red-DiscordBot
      branch:
        type: string
      version:
        type: string
      pull-request:
        type: number
      image-name-patterns:
        type: string
  workflow_call:
    inputs:
      repo:
        type: string
        default: Cog-Creators/Red-DiscordBot
      branch:
        type: string
      version:
        type: string
      pull-request:
        type: number
      image-name-patterns:
        type: string

jobs:
  generate-matrix:
    name: Generate OS matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      run-config: ${{ steps.generate-run.outputs.run-config }}
      os-matrix: ${{ steps.generate-run.outputs.os-matrix }}
      macos-matrix: ${{ steps.generate-run.outputs.macos-matrix }}

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Setup Python for building Red docs
        id: red-python
        uses: actions/setup-python@v7
        with:
          python-version: '3.8'

      - name: Install Hatch
        uses: pypa/hatch@install

      - name: Generate run
        id: generate-run
        env:
          INPUTS_REPO: ${{ inputs.repo }}
          INPUTS_BRANCH: ${{ inputs.branch }}
          INPUTS_VERSION: ${{ inputs.version }}
          INPUTS_PULL_REQUEST: ${{ inputs.pull-request }}
          INPUTS_IMAGE_NAME_PATTERNS: ${{ inputs.image-name-patterns }}
          RED_PYTHON_EXECUTABLE: ${{ steps.red-python.outputs.python-path }}
        run: |
          read -ra inputs <<< "$INPUTS_IMAGE_NAME_PATTERNS"
          inputs+=(--repo "$INPUTS_REPO")
          if [[ -n "$INPUTS_BRANCH" ]]; then
            inputs+=(--branch "$INPUTS_BRANCH")
          fi
          if [[ -n "$INPUTS_VERSION" ]]; then
            inputs+=(--version "$INPUTS_VERSION")
          fi
          if [[ "$INPUTS_PULL_REQUEST" -ne 0 ]]; then
            inputs+=(--pr "$INPUTS_PULL_REQUEST")
          fi
          hatch run generate-bare-run "${inputs[@]}"
          (echo -n 'run-config=' && cat os-build-run/run_config.json && echo) >> "$GITHUB_OUTPUT"
          # macOS does not support nested virtualization so we have to skip Tart-based images:
          # https://github.com/actions/runner-images/issues/13505
          # Instead, we'll run these directly on the GH Actions runner.
          # Below code generates macOS matrix based on the main OS matrix
          # and then excludes them from the main OS matrix.
          macos_matrix='[]'
          for os_name in macos-15 macos-26; do
            if jq -e '.matrix | any(.image_spec.name == $image_name)' --arg image_name "$os_name" os-build-run/os_matrix.json; then
              macos_matrix=$(echo "$macos_matrix" | jq -c '. += [$os_name]' --arg os_name "$os_name")
            fi
          done
          echo "macos-matrix=$macos_matrix" >> "$GITHUB_OUTPUT"
          (echo -n 'os-matrix=' && jq -c '.matrix |= map(select(.image_spec.os != "darwin"))' os-build-run/os_matrix.json) >> "$GITHUB_OUTPUT"

      - name: Add run configuration to workflow summary
        run: |
          echo '# Job parameters' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo -n '- Repo URL: ' >> "$GITHUB_STEP_SUMMARY"
          jq -r '.repo_url' os-build-run/run_config.json >> "$GITHUB_STEP_SUMMARY"
          echo -n '- Ref: `' >> "$GITHUB_STEP_SUMMARY"
          jq -j '.ref' os-build-run/run_config.json >> "$GITHUB_STEP_SUMMARY"
          echo '`' >> "$GITHUB_STEP_SUMMARY"
          echo -n '- Patterns: `' >> "$GITHUB_STEP_SUMMARY"
          jq -j '.patterns | join(" ") | select(. != "") // " "' os-build-run/run_config.json >> "$GITHUB_STEP_SUMMARY"
          echo '`' >> "$GITHUB_STEP_SUMMARY"

          echo '# Jobs' >> "$GITHUB_STEP_SUMMARY"
          while read -r job_config; do
            echo '<details>' >> "$GITHUB_STEP_SUMMARY"
            echo "$job_config" | jq -r '"<summary>\(.image_spec.name)</summary>"' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '## Image spec' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            echo "$job_config" | jq '.image_spec' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"

            echo '## Install instructions' >> "$GITHUB_STEP_SUMMARY"
            echo '```console' >> "$GITHUB_STEP_SUMMARY"
            echo "$job_config" | jq -r '
              .install_instructions[]
                | .elevated as $elevated
                | .commands[]
                | "\(if $elevated then "#" else "$" end) \(.)"
              ' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo '</details>' >> "$GITHUB_STEP_SUMMARY"
          done < <(jq -c '.matrix[]' os-build-run/os_matrix.json)

  test-install-instructions-macos:
    name: ${{ matrix.os }} - Test install instructions
    needs: generate-matrix
    if: needs.generate-matrix.outputs.macos-matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.generate-matrix.outputs.macos-matrix) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      # Before performing steps in GH Actions following steps are performed first:
      # 1. Remove JAVA_HOME and symlinks used by /usr/libexec/java_home to find Java
      - name: Perform Actions runner system pre-cleanup
        run: |-
          sed -i '' -E 's/^(export JAVA_HOME[^=]*=).*/\1/' ~/.bashrc
          sudo rm -f /Library/Java/JavaVirtualMachines/Temurin-Hotspot-*.jdk

      - name: Setup SSH server
        run: |
          mkdir -p ~/ssh_server/etc/ssh
          ssh-keygen -t ed25519 -N '' -f ~/ssh_server/ssh_key
          cat ~/ssh_server/ssh_key.pub >> ~/ssh_server/authorized_keys
          ssh-keygen -A -f ~/ssh_server
          echo 'Port 2222' >> ~/ssh_server/etc/ssh/sshd_config
          echo "HostKey $HOME/ssh_server/etc/ssh/ssh_host_rsa_key" >> ~/ssh_server/etc/ssh/sshd_config
          echo "HostKey $HOME/ssh_server/etc/ssh/ssh_host_ecdsa_key" >> ~/ssh_server/etc/ssh/sshd_config
          echo "HostKey $HOME/ssh_server/etc/ssh/ssh_host_ed25519_key" >> ~/ssh_server/etc/ssh/sshd_config
          echo "PidFile $HOME/ssh_server/etc/ssh/sshd.pid" >> ~/ssh_server/etc/ssh/sshd_config
          echo 'UsePAM yes' >> ~/ssh_server/etc/ssh/sshd_config
          echo "AllowUsers $USER" >> ~/ssh_server/etc/ssh/sshd_config
          echo "AuthorizedKeysFile $HOME/ssh_server/authorized_keys" >> ~/ssh_server/etc/ssh/sshd_config

      - name: Run SSH server
        id: run-ssh-server
        background: true
        run: |
          /usr/sbin/sshd -o LogLevel=DEBUG3 -ef ~/ssh_server/etc/ssh/sshd_config -D &

      - name: Prepare job directory
        env:
          RUN_CONFIG: ${{ needs.generate-matrix.outputs.run-config }}
          OS_MATRIX: ${{ needs.generate-matrix.outputs.os-matrix }}
          SPEC_NAME: ${{ matrix.os }}
          SPEC_ARCH: ${{ case(runner.arch == 'X64', 'x86_64', 'aarch64') }}
        run: |
          mkdir os-build-run
          echo "$RUN_CONFIG" > os-build-run/run_config.json
          install_instructions=$(echo "$OS_MATRIX" | jq -c '.instructions."mac.json"')
          jq -n '{image_spec: $ARGS.named, install_instructions: $instructions}' \
            --arg spec_type ssh \
            --arg name "$SPEC_NAME" \
            --arg os darwin \
            --arg arch "$SPEC_ARCH" \
            --arg expected_java_version 25 \
            --arg ssh_host 127.0.0.1 \
            --arg ssh_port 2222 \
            --arg ssh_username "$USER" \
            --arg ssh_private_key_file ~/ssh_server/ssh_key \
            --argjson instructions "$install_instructions" \
            > os-build-run/job_config.json
          jq . os-build-run/job_config.json

      - name: Install Hatch
        uses: pypa/hatch@install

      - name: Download builder requirements
        run: |
          hatch run download-builder-requirements -- --job-dir os-build-run

      - name: Prepare build directory
        run: hatch run prepare-build-dir

      - name: Build
        id: build
        env:
          PACKER_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          hatch run build

      - name: Stop SSH server
        cancel: run-ssh-server

      - name: Collect logs
        id: collect-logs
        env:
          IMAGE_NAME: ${{ matrix.os }}
        if: always() && contains(fromJSON('["success", "failure"]'), steps.build.conclusion)
        run: |
          cp os-build-run/packer-build/packer-1.log "${IMAGE_NAME}-packer-1.log"

      - name: Upload Packer logs
        if: always() && steps.collect-logs.conclusion == 'success'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.os }}-packer-1.log
          archive: false

  test-install-instructions:
    name: ${{ matrix.image_spec.name }} - Test install instructions
    if: toJSON(fromJSON(needs.generate-matrix.outputs.os-matrix).matrix) != '[]'
    needs: generate-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.generate-matrix.outputs.os-matrix).matrix }}
    # Linux ARM runners lack KVM acceleration so there's technically not much benefit to
    # using Linux ARM runners for this right now:
    # https://github.com/actions/runner-images/issues/14062
    runs-on: >-
      ${{ case(
          matrix.image_spec.os == 'darwin', 'macos-latest',
          matrix.image_spec.name == 'ubuntu-2404-arm-raspi', 'ubuntu-24.04-arm',
          matrix.image_spec.arch == 'aarch64', 'ubuntu-26.04-arm',
          'ubuntu-26.04'
      ) }}
    permissions:
      contents: read

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Prepare job directory
        env:
          RUN_CONFIG: ${{ needs.generate-matrix.outputs.run-config }}
          JOB_CONFIG: ${{ toJSON(matrix) }}
        run: |
          mkdir os-build-run
          echo "$RUN_CONFIG" > os-build-run/run_config.json
          echo "$JOB_CONFIG" > os-build-run/job_config.json

      - name: Increase available disk space on the runner
        uses: endersonmenezes/free-disk-space@7901478139cff6e9d44df5972fd8ab8fcade4db1 # v3.2.2
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_folders: >-
              /opt/az
              /opt/google
              /opt/microsoft/msedge
              /usr/lib/firefox
              /usr/lib/google-cloud-sdk
              /usr/lib/jvm
              /usr/lib/llvm-*
              /usr/local/julia*
              /usr/local/share/chromium
              /usr/share/az_*
              /usr/share/miniconda
              /usr/share/swift
          rm_cmd: rmz

      - name: Print available disk space on the runner
        run: df -h

      - name: Install Hatch
        uses: pypa/hatch@install

      - name: Download builder requirements (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install qemu-system xorriso
          # `usermod -aG "$USER" kvm` doesn't seem to be enough so just chown it...
          if [[ -e /dev/kvm ]]; then
            sudo chown "$USER" /dev/kvm
          fi
          hatch run download-builder-requirements -- --job-dir os-build-run

      - name: Download builder requirements (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install qemu
          hatch run download-builder-requirements -- --job-dir os-build-run

      - name: Prepare build directory
        run: hatch run prepare-build-dir

      - name: Build
        id: build
        env:
          PACKER_GITHUB_API_TOKEN: ${{ github.token }}
        run: hatch run build -- --attempts 3

      - name: Collect logs
        id: collect-logs
        env:
          IMAGE_NAME: ${{ matrix.image_spec.name }}
        if: always() && contains(fromJSON('["success", "failure"]'), steps.build.conclusion)
        run: |
          cp os-build-run/packer-build/packer-1.log "${IMAGE_NAME}-packer-1.log"
          cp os-build-run/packer-build/packer-2.log "${IMAGE_NAME}-packer-2.log" || true
          cp os-build-run/packer-build/packer-3.log "${IMAGE_NAME}-packer-3.log" || true

      - name: Upload Packer logs for attempt 1
        if: always() && steps.collect-logs.conclusion == 'success'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.image_spec.name }}-packer-1.log
          archive: false

      - name: Upload Packer logs for attempt 2
        id: upload-packer-logs-for-attempt-2
        if: always() && steps.collect-logs.conclusion == 'success'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.image_spec.name }}-packer-2.log
          archive: false
          if-no-files-found: ignore

      - name: Upload Packer logs for attempt 3
        if: always() && steps.collect-logs.conclusion == 'success'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.image_spec.name }}-packer-3.log
          archive: false
          if-no-files-found: ignore

      - name: Collect failure screenshots
        id: collect-failure-screenshots
        env:
          IMAGE_NAME: ${{ matrix.image_spec.name }}
        if: always() && steps.build.conclusion == 'failure' || steps.upload-packer-logs-for-attempt-2.outputs.artifact-id != null
        run: |
          cp os-build-run/packer-build/screen-1.mkv "${IMAGE_NAME}-screen-1.mkv"
          cp os-build-run/packer-build/screen-2.mkv "${IMAGE_NAME}-screen-2.mkv" || true
          cp os-build-run/packer-build/screen-3.mkv "${IMAGE_NAME}-screen-3.mkv" || true

      - name: Upload failure screenshot for attempt 1
        if: always() && steps.collect-failure-screenshots.conclusion == 'success'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.image_spec.name }}-screen-1.mkv
          archive: false

      - name: Upload failure screenshot for attempt 2
        if: always() && steps.collect-failure-screenshots.conclusion == 'success'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.image_spec.name }}-screen-2.mkv
          archive: false
          if-no-files-found: ignore

      - name: Upload failure screenshot for attempt 3
        if: always() && steps.collect-failure-screenshots.conclusion == 'success'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.image_spec.name }}-screen-3.mkv
          archive: false
          if-no-files-found: ignore

      - name: Collect failure cloud-init logs
        id: collect-failure-cloud-init-logs
        env:
          IMAGE_NAME: ${{ matrix.image_spec.name }}
        if: >-
          always()
          && matrix.image_spec.os == 'linux'
          && steps.build.conclusion == 'failure'
          || steps.upload-packer-logs-for-attempt-2.outputs.artifact-id != null
        run: |
          cp os-build-run/packer-build/cloud-init-1.tar.gz "${IMAGE_NAME}-cloud-init-1.tar.gz" || true
          cp os-build-run/packer-build/cloud-init-2.tar.gz "${IMAGE_NAME}-cloud-init-2.tar.gz" || true
          cp os-build-run/packer-build/cloud-init-3.tar.gz "${IMAGE_NAME}-cloud-init-3.tar.gz" || true

      - name: Upload failure cloud-init logs for attempt 1
        if: always() && steps.collect-failure-cloud-init-logs.conclusion == 'success'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.image_spec.name }}-cloud-init-1.tar.gz
          archive: false
          if-no-files-found: ignore

      - name: Upload failure cloud-init logs for attempt 2
        if: always() && steps.collect-failure-cloud-init-logs.conclusion == 'success'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.image_spec.name }}-cloud-init-2.tar.gz
          archive: false
          if-no-files-found: ignore

      - name: Upload failure cloud-init logs for attempt 3
        if: always() && steps.collect-failure-cloud-init-logs.conclusion == 'success'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.image_spec.name }}-cloud-init-3.tar.gz
          archive: false
          if-no-files-found: ignore

  generate-summary:
    name: Generate run summary
    needs:
      - generate-matrix
      - test-install-instructions
      - test-install-instructions-macos
    if: always() && needs.generate-matrix.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Download log artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: '*-packer-*.log'
          merge-multiple: true

      - name: Generate run summary
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          declare -A job_conclusions
          declare -A job_urls
          while read -r image_name conclusion url; do
            job_conclusions[$image_name]="$conclusion"
            job_urls[$image_name]="$url"
          done < <(
            gh run view "$GITHUB_RUN_ID" --json jobs \
              --jq '
                .jobs[]
                | select(.name | endswith(" - Test install instructions"))
                | select(.name | startswith("${{ '${{' }}") | not)
                | "\(.name | split(" / ")[-1] | split(" ")[0]) \(.conclusion) \(.url)"
              '
          )

          artifacts_resp=$(gh api --paginate "/repos/{owner}/{repo}/actions/runs/$GITHUB_RUN_ID/artifacts")

          # successful jobs should be shown after all the other jobs
          image_names=()
          successful_image_names=()
          declare -A job_attempt_counts
          while read -r image_name attempt_count; do
            if [[ "${job_conclusions[$image_name]}" == 'success' ]]; then
              successful_image_names+=("$image_name")
            else
              image_names+=("$image_name")
            fi
            job_attempt_counts[$image_name]="$attempt_count"
          done < <(
            echo "$artifacts_resp" | jq -r \
              '[.artifacts[].name]
                | map(select(. | test("-packer-\\d.log")))
                | group_by(.[:-13])
                | sort_by(-(. | length), .)[]
                | "\(.[0][:-13]) \(. | length)"
              '
          )
          image_names+=("${successful_image_names[@]}")

          declare -A job_artifact_links
          while read -r image_name artifact_links; do
            job_artifact_links[$image_name]="$artifact_links"
          done < <(
            echo "$artifacts_resp" | jq --arg repo_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" -r \
              '.artifacts
                | map(select(.name | test("-packer-\\d.log|-screen-\\d.mkv")))
                | group_by(.name[:-13])
                | map({
                    key: .[0].name[:-13],
                    value: [
                      .
                      | sort_by(.name)
                      | .[]
                      | "[\(.name)](\($repo_url)/actions/runs/\(.workflow_run.id)/artifacts/\(.id))"
                    ]
                  })
                | sort_by(-(.value | length), .key)[]
                | "\(.key) \(.value | join(" "))"
              '
          )

          echo '# Run summary' >> "$GITHUB_STEP_SUMMARY"
          echo '| Image name | Conclusion | Attempt count | Artifacts |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | --- | --- | --- |' >> "$GITHUB_STEP_SUMMARY"

          for image_name in "${image_names[@]}"; do
            conclusion="${job_conclusions[$image_name]}"
            url="${job_urls[$image_name]}"
            case "$conclusion" in
              success)
                conclusion_emoji=":white_check_mark:"
                ;;
              cancelled)
                conclusion_emoji=":no_entry_sign:"
                ;;
              failure)
                conclusion_emoji=":x:"
                ;;
              *)
                conclusion_emoji=":warning:"
                ;;
            esac
            attempt_count="${job_attempt_counts[$image_name]}"
            if [[ -z "$attempt_count" ]]; then
              attempt_count='0'
            fi
            artifact_links="${job_artifact_links[$image_name]}"
            echo "| [$image_name]($url) | $conclusion_emoji $conclusion | $attempt_count | $artifact_links |" >> "$GITHUB_STEP_SUMMARY"
          done

          if [[ " ${job_conclusions[@]} " == *' failure '* ]]; then
            echo '# Failed jobs' >> "$GITHUB_STEP_SUMMARY"
            for image_name in "${image_names[@]}"; do
              conclusion="${job_conclusions[$image_name]}"
              if [[ "$conclusion" == 'failure' ]]; then
                echo "## $image_name" >> "$GITHUB_STEP_SUMMARY"
                attempt=0
                for file in artifacts/"$image_name"-packer-*.log; do
                  attempt=$((attempt + 1))
                  echo "### Attempt $attempt" >> "$GITHUB_STEP_SUMMARY"
                  echo "```" >> "$GITHUB_STEP_SUMMARY"
                  sed -n -E \
                      's#([0-9]{4}/[0-9]{2}/[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}) ui( error)?: (.+)#\1 \3#p' \
                      "$file" \
                    | tail -50 | ansi2txt >> "$GITHUB_STEP_SUMMARY"
                  echo "```" >> "$GITHUB_STEP_SUMMARY"
                done
              fi
            done
          fi
